
name: Java CI
 
on:
  push:
    branches: [ "main" ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

 
      - name: Compile Java
        run: javac *.java
 
      - name: Run tests
        run: java CalculatorTest


